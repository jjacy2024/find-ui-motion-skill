<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UI Motion Directions</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b12;
      --panel: rgba(20, 24, 38, .82);
      --line: rgba(255, 255, 255, .1);
      --muted: #9da7bd;
      --text: #f6f7fb;
      --accent: #8d7bff;
      --accent-2: #50d6c8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font: 15px/1.5 Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 0%, rgba(141, 123, 255, .18), transparent 34%),
        radial-gradient(circle at 88% 6%, rgba(80, 214, 200, .13), transparent 30%),
        var(--bg);
    }
    main { width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 56px 0 72px; }
    header { display: grid; gap: 14px; margin-bottom: 34px; }
    .eyebrow { color: var(--accent-2); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
    h1 { max-width: 880px; margin: 0; font-size: clamp(32px, 6vw, 64px); line-height: 1.02; letter-spacing: -.045em; }
    .lead { max-width: 760px; margin: 0; color: var(--muted); font-size: 16px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
    button, a {
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text);
      background: rgba(255,255,255,.055);
      padding: 9px 14px;
      font: inherit;
      text-decoration: none;
    }
    button { cursor: pointer; }
    button:hover, a:hover { background: rgba(255,255,255,.11); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 16px; }
    article {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--panel);
      backdrop-filter: blur(18px);
    }
    .stage {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 220px;
      overflow: hidden;
      background:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(135deg, rgba(141,123,255,.12), rgba(80,214,200,.06));
      background-size: 24px 24px, 24px 24px, auto;
    }
    .stage::after {
      content: "";
      position: absolute;
      inset: 14px;
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 16px;
      pointer-events: none;
    }
    .demo {
      position: relative;
      z-index: 1;
      width: 112px;
      height: 82px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 20px;
      background: linear-gradient(145deg, rgba(255,255,255,.22), rgba(255,255,255,.06));
      box-shadow: 0 24px 64px rgba(0,0,0,.35), inset 0 1px rgba(255,255,255,.22);
      transform-style: preserve-3d;
      will-change: transform, opacity, filter, clip-path;
    }
    .demo::before, .demo::after { content: ""; position: absolute; border-radius: 999px; }
    .demo::before { width: 38px; height: 8px; top: 20px; left: 18px; background: var(--accent-2); opacity: .9; }
    .demo::after { width: 68px; height: 8px; top: 40px; left: 18px; background: rgba(255,255,255,.32); }
    .copy { display: grid; gap: 13px; padding: 20px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h2 { margin: 0; font-size: 19px; letter-spacing: -.02em; }
    .pill { flex: none; color: #c8c0ff; font-size: 11px; border: 1px solid rgba(141,123,255,.26); background: rgba(141,123,255,.1); border-radius: 999px; padding: 4px 8px; }
    dl { display: grid; grid-template-columns: 78px 1fr; gap: 7px 10px; margin: 0; font-size: 13px; }
    dt { color: #737e95; }
    dd { margin: 0; color: #c9cfdb; overflow-wrap: anywhere; }
    .synthesis { color: var(--muted); font-size: 12px; padding-top: 8px; border-top: 1px solid var(--line); }
    footer { margin-top: 24px; color: #758097; font-size: 12px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <span class="eyebrow">Find UI Motion · Local Preview</span>
      <h1 id="title">Motion directions</h1>
      <p class="lead" id="note"></p>
      <div class="toolbar">
        <button id="replay-all" type="button">Replay all</button>
        <span class="pill" id="version"></span>
      </div>
    </header>
    <section class="grid" id="grid"></section>
    <footer>This page contains local synthesis only. It does not depict or cite an exact source-site example.</footer>
  </main>
  <script id="motion-data" type="application/json">__FIND_UI_MOTION_DATA__</script>
  <script>
    const data = JSON.parse(document.getElementById('motion-data').textContent);
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const duration = reduced ? 1 : 900;

    function framesFor(category) {
      const frames = {
        entrance: [{opacity:0, transform:'translateY(22px) scale(.94)'}, {opacity:1, transform:'translateY(0) scale(1)'}],
        exit: [{opacity:1, transform:'translateY(0) scale(1)'}, {opacity:0, transform:'translateY(18px) scale(.9)'}],
        hover: [{transform:'translateY(0) rotateX(0) rotateY(0)'}, {transform:'translateY(-12px) rotateX(8deg) rotateY(-10deg)'}, {transform:'translateY(0) rotateX(0) rotateY(0)'}],
        feedback: [{transform:'scale(1)'}, {transform:'scale(.84, .92)'}, {transform:'scale(1.08, .96)'}, {transform:'scale(1)'}],
        transition: [{opacity:0, transform:'translateX(34px) scale(.92)', borderRadius:'34px'}, {opacity:1, transform:'translateX(0) scale(1)', borderRadius:'20px'}],
        scroll: [{opacity:.15, transform:'translateY(34px)'}, {opacity:1, transform:'translateY(-8px)'}, {opacity:.65, transform:'translateY(-24px)'}],
        loading: [{transform:'rotate(0deg) scale(.88)', filter:'hue-rotate(0deg)'}, {transform:'rotate(180deg) scale(1.08)', filter:'hue-rotate(90deg)'}, {transform:'rotate(360deg) scale(.88)', filter:'hue-rotate(0deg)'}],
        text: [{clipPath:'inset(0 100% 0 0)', transform:'translateY(10px)'}, {clipPath:'inset(0 0 0 0)', transform:'translateY(0)'}],
        ambient: [{transform:'translateY(8px) rotate(-2deg) scale(.98)'}, {transform:'translateY(-10px) rotate(3deg) scale(1.04)'}, {transform:'translateY(8px) rotate(-2deg) scale(.98)'}],
        'three-d': [{transform:'perspective(500px) rotateY(-30deg) translateZ(-20px)'}, {transform:'perspective(500px) rotateY(25deg) translateZ(30px)'}, {transform:'perspective(500px) rotateY(-30deg) translateZ(-20px)'}]
      };
      return frames[category] || frames.entrance;
    }

    function play(element, category) {
      element.getAnimations().forEach(animation => animation.cancel());
      element.animate(framesFor(category), {
        duration,
        iterations: reduced ? 1 : (['ambient', 'loading', 'three-d'].includes(category) ? 2 : 1),
        easing: category === 'feedback' ? 'cubic-bezier(.2, 1.4, .3, 1)' : 'cubic-bezier(.2, .8, .2, 1)',
        fill: 'both'
      });
    }

    const grid = document.getElementById('grid');
    document.getElementById('title').textContent = `“${data.query}” 的动效方向`;
    document.getElementById('note').textContent = data.generated_note;
    document.getElementById('version').textContent = `catalog ${data.catalog_version}`;

    data.matches.forEach((match, index) => {
      const m = match.motion;
      const article = document.createElement('article');
      article.innerHTML = `
        <div class="stage"><div class="demo" aria-label="${m.labels[0]} preview"></div></div>
        <div class="copy">
          <div class="row"><h2>${index + 1}. ${m.labels[0]}</h2><span class="pill">${m.category}</span></div>
          <dl>
            <dt>Target</dt><dd>${m.targets.join(', ')}</dd>
            <dt>Trigger</dt><dd>${m.triggers.join(', ')}</dd>
            <dt>Feel</dt><dd>${m.feel.join(', ')}</dd>
            <dt>Channels</dt><dd>${m.channels.join(', ')}</dd>
          </dl>
          <div class="synthesis">Local synthesis · no source claim</div>
        </div>`;
      const demo = article.querySelector('.demo');
      article.querySelector('.stage').addEventListener('click', () => play(demo, m.category));
      grid.appendChild(article);
      setTimeout(() => play(demo, m.category), index * 100);
    });

    document.getElementById('replay-all').addEventListener('click', () => {
      [...document.querySelectorAll('.demo')].forEach((demo, index) => {
        setTimeout(() => play(demo, data.matches[index].motion.category), index * 90);
      });
    });
  </script>
</body>
</html>
